name = "LeanLTL"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["LeanLTL", "LeanLTLExamples"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.1"

[[lean_lib]]
name = "LeanLTL"

[[lean_lib]]
name = "LeanLTLExamples"
